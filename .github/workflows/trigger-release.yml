name: Deploy to Ark

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # You can specify your desired Node.js version here

      - name: Install dependencies
        run: npm install  # Or use `yarn install` if you're using yarn

      # docker setup - part 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker setup - part 2
      - name: Login to Ark registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Deploy to Staging
      - name: 🚀 Deploy to Staging
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_API_URL: ${{ secrets.TRIGGER_API_URL }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          npm run deploy --env stg --registry "$REGISTRY_URL"  # Modify your deploy script to handle env

      # Deploy to Production
      - name: 🚀 Deploy to Production
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_API_URL: ${{ secrets.TRIGGER_API_URL }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          npm run deploy --env prd --registry "$REGISTRY_URL"  # Modify your deploy script to handle env
